---
- name: Configure SSH access
  hosts: all
  connection: local
  become: true
  gather_facts: true

  vars:
    ssh_admin_user: "{{ lookup('env', 'SUDO_USER') | default(lookup('env', 'USER'), true) }}"

  pre_tasks:
    - name: Validate the target host
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Ubuntu'
          - ssh_admin_user | length > 0
          - ssh_admin_user != 'root'
        fail_msg: Run this playbook on Ubuntu as a non-root user with become enabled

    - name: Read the SSH administrator account
      ansible.builtin.getent:
        database: passwd
        key: "{{ ssh_admin_user }}"

    - name: Set SSH administrator account details
      ansible.builtin.set_fact:
        ssh_admin_group: "{{ ansible_facts.getent_passwd[ssh_admin_user][2] }}"
        ssh_admin_home: "{{ ansible_facts.getent_passwd[ssh_admin_user][4] }}"

  tasks:
    - name: Install SSH packages
      ansible.builtin.apt:
        name:
          - keychain
          - openssh-server
          - ufw
        state: present
        update_cache: true

    - name: Enable and start SSH
      ansible.builtin.systemd_service:
        name: ssh
        enabled: true
        state: started

    - name: Read UFW status
      ansible.builtin.command: ufw status
      register: ssh_ufw_status
      changed_when: false
      check_mode: false

    - name: Allow SSH through UFW
      ansible.builtin.command: ufw allow ssh
      when: "'22/tcp' not in ssh_ufw_status.stdout"

    - name: Create the SSH configuration directory
      ansible.builtin.file:
        path: "{{ ssh_admin_home }}/.ssh"
        state: directory
        owner: "{{ ssh_admin_user }}"
        group: "{{ ssh_admin_group }}"
        mode: '0700'

    - name: Install the SSH client configuration
      ansible.builtin.copy:
        src: ../assets/ssh_config
        dest: "{{ ssh_admin_home }}/.ssh/config"
        owner: "{{ ssh_admin_user }}"
        group: "{{ ssh_admin_group }}"
        mode: '0600'
        backup: true

    - name: Check for a Zsh configuration
      ansible.builtin.stat:
        path: "{{ ssh_admin_home }}/.zshrc"
      register: ssh_zshrc

    - name: Select the shell configuration
      ansible.builtin.set_fact:
        ssh_shell_rc: "{{ ssh_admin_home }}/{{ '.zshrc' if ssh_zshrc.stat.exists else '.bashrc' }}"

    - name: Add the keychain description to the shell configuration
      ansible.builtin.lineinfile:
        path: "{{ ssh_shell_rc }}"
        line: '# Start SSH agent with keychain'
        insertafter: EOF
        create: true
        owner: "{{ ssh_admin_user }}"
        group: "{{ ssh_admin_group }}"
        mode: '0644'

    - name: Enable keychain in the shell configuration
      ansible.builtin.lineinfile:
        path: "{{ ssh_shell_rc }}"
        line: 'eval $(keychain --eval --quiet)'
        insertafter: '^# Start SSH agent with keychain$'
        owner: "{{ ssh_admin_user }}"
        group: "{{ ssh_admin_group }}"
        mode: '0644'
