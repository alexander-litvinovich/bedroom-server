---
- name: Install and monitor Tailscale
  hosts: localhost
  become: true
  gather_facts: true

  pre_tasks:
    - name: Validate the target host
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Ubuntu'
          - ansible_architecture in ['x86_64', 'aarch64']
        fail_msg: Run this playbook on supported Ubuntu hardware with become enabled

  tasks:
    - name: Install curl
      ansible.builtin.apt:
        name: curl
        state: present
        update_cache: true

    - name: Install Tailscale
      ansible.builtin.shell: |
        set -o pipefail
        curl -fsSL https://tailscale.com/install.sh | /bin/sh
      args:
        creates: /usr/bin/tailscale
        executable: /bin/bash

    - name: Enable and start Tailscale
      ansible.builtin.systemd_service:
        name: tailscaled
        enabled: true
        state: started

    - name: Persist IPv4 forwarding for the subnet router
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-tailscale.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          net.ipv4.ip_forward = 1
      register: tailscale_forwarding

    - name: Apply IPv4 forwarding
      ansible.builtin.command: sysctl -p /etc/sysctl.d/99-tailscale.conf
      when: tailscale_forwarding.changed

    - name: Check Tailscale login state
      ansible.builtin.command: tailscale status --json
      register: tailscale_status
      changed_when: false

    - name: Advertise the home subnet when Tailscale is connected
      when: (tailscale_status.stdout | from_json).BackendState == 'Running'
      block:
        - name: Read current Tailscale preferences
          ansible.builtin.command: tailscale debug prefs
          register: tailscale_prefs
          changed_when: false

        - name: Advertise the home subnet
          ansible.builtin.command:
            argv:
              - tailscale
              - set
              - "--advertise-routes={{ (((tailscale_prefs.stdout | from_json).AdvertiseRoutes | default([], true)) + ['192.168.100.0/24']) | unique | join(',') }}"
          when: "'192.168.100.0/24' not in ((tailscale_prefs.stdout | from_json).AdvertiseRoutes | default([], true))"

    - name: Install the Tailscale health check
      ansible.builtin.copy:
        dest: /usr/local/sbin/tailscale-healthcheck
        owner: root
        group: root
        mode: '0755'
        content: |
          #!/bin/sh
          set -eu

          if curl --silent --show-error --fail --max-time 10 \
            --unix-socket /run/tailscale/tailscaled.sock \
            --header 'Sec-Tailscale: localapi' \
            http://local-tailscaled.sock/localapi/v0/status >/dev/null; then
            exit 0
          fi

          logger -t tailscale-healthcheck 'local API is unresponsive; restarting tailscaled'
          systemctl restart tailscaled

    - name: Install the Tailscale health-check service
      ansible.builtin.copy:
        dest: /etc/systemd/system/tailscale-healthcheck.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Restart Tailscale when its local API stops responding
          After=tailscaled.service
          Requires=tailscaled.service

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/tailscale-healthcheck
          TimeoutStartSec=30

    - name: Install the Tailscale health-check timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/tailscale-healthcheck.timer
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Check Tailscale every five minutes

          [Timer]
          OnBootSec=5min
          OnUnitActiveSec=5min
          RandomizedDelaySec=30s
          Persistent=true

          [Install]
          WantedBy=timers.target

    - name: Enable the Tailscale health-check timer
      ansible.builtin.systemd_service:
        name: tailscale-healthcheck.timer
        enabled: true
        state: started
        daemon_reload: true
